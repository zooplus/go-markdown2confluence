name: Build & Release

on:
  push:
    paths-ignore:
      - "README.md"
    branches:
      - master
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -cover ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Dry run: only calculates the next version, the tag is pushed by the release job
      - name: Calculate next version
        if: github.ref == 'refs/heads/master'
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          dry_run: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.tag_version.outputs.new_tag }}"
          OUTPUT_NAME=markdown2confluence-${{ matrix.os }}-${{ matrix.arch }}
          if [ "${{ matrix.os }}" == "windows" ]; then
            OUTPUT_NAME+=".exe"
          fi
          if [ "${{ matrix.os }}" == "darwin" ]; then
            OUTPUT_NAME=markdown2confluence-macos-${{ matrix.arch }}
          fi
          go build \
            -ldflags="-s -w -X main.version=${VERSION:-dev}" \
            -o bin/$OUTPUT_NAME \
            .

          echo "binary=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.binary }}
          path: bin/*

  smoke-tests:
    name: smoke test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            binary: markdown2confluence-linux-amd64
          - os: macos-latest
            binary: markdown2confluence-macos-arm64
          - os: windows-latest
            binary: markdown2confluence-windows-amd64.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: .

      - name: Run binary
        shell: bash
        run: |
          chmod +x ${{ matrix.binary }}
          ./${{ matrix.binary }} --version
          ./${{ matrix.binary }} --help

  release:
    needs:
      - smoke-tests
      - build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Calculate checksums
        run: |
          cd bin
          sha512sum markdown2confluence-* > sha512sums.txt

      # Bumps the semver tag based on conventional commits since the last
      # release (feat -> minor, BREAKING CHANGE -> major, anything else -> patch).
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag_version.outputs.new_tag }}" bin/* \
            --title "Release ${{ steps.tag_version.outputs.new_tag }}" \
            --notes "${{ steps.tag_version.outputs.changelog }}"
